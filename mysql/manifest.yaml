apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: expense
  labels:
    name: mysql
    project: expense
    tier: db
    component: mysql
spec:
  replicas: 2
  selector:
    matchLabels:
      name: mysql
      project: expense
      tier: db
      component: mysql
  template:
    metadata:
      labels:
        name: mysql
        project: expense
        tier: db
        component: mysql
    spec:
      containers:
      - name: mysql
        image: joindevops/mysql:v1.0

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: expense
spec:
  selector:
    name: mysql
    project: expense
    tier: db
    component: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306






